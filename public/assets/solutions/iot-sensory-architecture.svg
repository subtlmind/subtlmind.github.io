<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0A1020"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10182B"/>
      <stop offset="100%" stop-color="#0B111F"/>
    </linearGradient>

    <!-- Teal Glow Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Flow Line Filter (Glow) -->
    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect width="800" height="480" fill="url(#techGrid)"/>

  <!-- Top Technical Header -->
  <rect x="0" y="0" width="800" height="42" fill="rgba(10, 16, 28, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <circle cx="24" cy="21" r="4" fill="#2DD4BF" filter="url(#tealGlow)"/>
  <text x="36" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SUBTLMIND</text>
  <text x="124" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">// PILLAR 01: SENSORY DATA &amp; IOT ARCHITECTURE</text>
  
  <rect x="670" y="11" width="108" height="20" rx="4" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1"/>
  <text x="724" y="25" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">&lt; 15ms INGESTION</text>

  <!-- SECTION 1: PHYSICAL SENSORY NODES -->
  <rect x="24" y="62" width="170" height="355" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="38" y="86" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">01 / SENSOR NODES</text>
  <text x="38" y="104" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Physical Ingest</text>

  <!-- Node 1: Vibration & Acoustics -->
  <g transform="translate(36, 120)">
    <rect width="146" height="58" rx="6" fill="#0C1424" stroke="rgba(45, 212, 191, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#2DD4BF"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Vibration / FFT</text>
    <text x="28" y="36" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">10 kHz Piezo Sensor</text>
    <text x="28" y="48" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9">±16g Dynamic Range</text>
  </g>

  <!-- Node 2: mmWave Occupancy -->
  <g transform="translate(36, 188)">
    <rect width="146" height="58" rx="6" fill="#0C1424" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#F59E0B"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">mmWave Radar</text>
    <text x="28" y="36" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">24 GHz Micro-Doppler</text>
    <text x="28" y="48" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="9">Zero-Camera Privacy</text>
  </g>

  <!-- Node 3: Lux & Environmental -->
  <g transform="translate(36, 256)">
    <rect width="146" height="58" rx="6" fill="#0C1424" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#2DD4BF"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Ambient Lux &amp; Air</text>
    <text x="28" y="36" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">0.01 - 100k Lux | I2C</text>
    <text x="28" y="48" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">CO2, VOC &amp; Humidity</text>
  </g>

  <!-- Node 4: Power Harmonics -->
  <g transform="translate(36, 324)">
    <rect width="146" height="58" rx="6" fill="#0C1424" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <circle cx="16" cy="18" r="5" fill="#A78BFA"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Power Harmonics</text>
    <text x="28" y="36" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">CT Induction Clamp</text>
    <text x="28" y="48" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="9">Sub-meter Wattage</text>
  </g>

  <!-- CONNECTORS: NODES TO PROTOCOL BUS -->
  <path d="M 182 149 L 222 149 L 222 240 L 235 240" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 182 217 L 235 217" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <path d="M 182 285 L 222 285 L 222 240 L 235 240" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
  <path d="M 182 353 L 235 353" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- SECTION 2: PROTOCOL BUS -->
  <rect x="235" y="100" width="125" height="280" rx="8" fill="#090E1A" stroke="rgba(45, 212, 191, 0.2)" stroke-width="1"/>
  <text x="247" y="124" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">MULTI-PROTOCOL</text>
  <text x="247" y="139" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Edge Bus</text>

  <!-- Protocol Pills -->
  <g transform="translate(247, 154)">
    <rect width="101" height="26" rx="4" fill="#10192D" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="8" y="17" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">MQTT v5.0 Broker</text>
  </g>
  <g transform="translate(247, 188)">
    <rect width="101" height="26" rx="4" fill="#10192D" stroke="rgba(255, 255, 255, 0.08)"/>
    <text x="8" y="17" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Modbus RTU/TCP</text>
  </g>
  <g transform="translate(247, 222)">
