  <!-- Immediate Theme Initializer to Prevent Flash of Unstyled Theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('subtlmind_theme') || localStorage.getItem('inx_theme');
        var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = (saved === 'dark' || saved === 'light') ? saved : (prefersLight ? 'light' : 'dark');
        if (theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.add('light-theme');
        }
      } catch(e) {}
    })();
  </script>
