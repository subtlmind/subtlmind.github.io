    <circle cx="16" cy="18" r="4.5" fill="#A78BFA"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Thermal &amp; CO2 Delta</text>
    <text x="28" y="38" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Temp: 23.4°C | CO2: 540 ppm</text>
    <text x="28" y="52" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="8">Comfort delta target: 22.0°C</text>
