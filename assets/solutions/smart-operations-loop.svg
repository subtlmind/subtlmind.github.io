    <rect width="209" height="48" rx="6" fill="#090E1A" stroke="rgba(45, 212, 191, 0.3)"/>
    <text x="12" y="22" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800">-35%</text>
