  <!-- Feedback Loop Closed Pill -->
  <g transform="translate(553, 358)">
    <rect width="209" height="46" rx="6" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)"/>
    <circle cx="18" cy="23" r="3.5" fill="#10B981"/>
    <text x="28" y="20" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700">CLOSED-LOOP FEEDBACK: ACTIVE</text>
    <text x="28" y="33" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="8">Continuous sensor-to-actuation sync</text>
  </g>

  <!-- BOTTOM STATUS & TELEMETRY STRIP -->
  <rect x="0" y="440" width="800" height="40" fill="rgba(6, 9, 15, 0.95)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <text x="24" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">ORCHESTRATION: </text>
  <text x="125" y="464" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SUBTLMIND AUTONOMY</text>
  <text x="290" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">BMS INTERFACE: </text>
  <text x="385" y="464" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">BACnet IP &amp; Modbus</text>
  <text x="560" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">SAVINGS: </text>
  <text x="618" y="464" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">-35% kWh</text>
  <text x="705" y="464" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">98.6%</text>
</svg>
