    <circle cx="16" cy="18" r="4.5" fill="#F59E0B"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Natural Daylight Gradient</text>
    <text x="28" y="38" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Exterior Lux: 450 lx (Sunset)</text>
    <text x="28" y="52" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="8">Triggering warm circadian shift</text>
