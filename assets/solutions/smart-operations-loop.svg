    <circle cx="16" cy="18" r="4.5" fill="#2DD4BF"/>
    <text x="28" y="22" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">mmWave Presence</text>
    <text x="28" y="38" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Zone A: 12 Occupants</text>
    <text x="28" y="52" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="8">Zero-camera privacy compliance</text>
