    <text x="12" y="22" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800">98.6%</text>
    <text x="12" y="38" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Occupant Comfort &amp; Air Index Score</text>
