    <text x="10" y="35" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="9">Cove lighting dimmed: 35% amber</text>
    <text x="10" y="47" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8">CCT: 2700K warm tone</text>
  </g>

