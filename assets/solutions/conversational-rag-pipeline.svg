  <text x="558" y="86" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">03 / SYNTHESIS</text>
  <text x="558" y="104" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Actionable Response</text>

