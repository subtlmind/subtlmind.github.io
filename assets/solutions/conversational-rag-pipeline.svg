  <rect x="24" y="62" width="200" height="355" rx="10" fill="url(#cardGrad3)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <text x="38" y="86" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">01 / HUMAN QUERY</text>
  <text x="38" y="104" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Natural Language</text>

