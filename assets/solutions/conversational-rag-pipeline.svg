  <text x="24" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">PIPELINE: </text>
  <text x="90" y="464" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">SUBTLMIND DOMAIN-RAG</text>
  <text x="280" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">GROUNDING: </text>
  <text x="365" y="464" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">OEM MANUALS + TELEMETRY</text>
  <text x="560" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">PRIVACY: </text>
  <text x="625" y="464" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">AIR-GAP CAPABLE</text>
  <text x="735" y="464" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">780ms</text>
