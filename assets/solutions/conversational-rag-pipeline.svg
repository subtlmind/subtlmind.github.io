    <text x="12" y="120" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8">✓ Drafted Work Order #4092</text>
    <text x="12" y="136" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8">✓ Scheduled weekend window</text>
  </g>

