    <rect width="176" height="80" rx="8" fill="rgba(45, 212, 191, 0.12)" stroke="rgba(45, 212, 191, 0.35)"/>
    <text x="12" y="20" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">OPERATOR PROMPT</text>
    <text x="12" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">"Why did Chiller #2</text>
    <text x="12" y="56" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">power spike by 14%?"</text>
    <text x="12" y="72" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="8">Voice / Chat / Mobile Webhook</text>
  </g>

