    <text x="12" y="20" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">RESIDENTIAL PROMPT</text>
    <text x="12" y="40" fill="#CBD5E1" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">"Set evening living</text>
