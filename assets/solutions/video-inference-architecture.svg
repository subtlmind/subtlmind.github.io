  <text x="36" y="25" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SUBTLMIND</text>
  <text x="124" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="1">// PILLAR 02: REAL-TIME VIDEO INFERENCE &amp; COMPUTER VISION</text>
  
