  <text x="24" y="464" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">EDGE VISION RUNTIME ACTIVE</text>
  <text x="220" y="464" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9.5">FPS: 60 | INFERENCE: 18.2ms | PRECISION: 99.2% mAP | DETECTIONS: 42/SEC | ON-DEVICE PRIVACY: 100%</text>
