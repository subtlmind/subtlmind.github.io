<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradVision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#09101E"/>
      <stop offset="100%" stop-color="#06090F"/>
    </linearGradient>

    <!-- Card Fill -->
    <linearGradient id="cardGradVision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10182B"/>
      <stop offset="100%" stop-color="#0B111F"/>
    </linearGradient>

    <!-- Teal Gradient -->
    <linearGradient id="tealGradV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Amber / Thermal Gradient -->
    <linearGradient id="thermalGradV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGridV" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="tealGlowV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="amberGlowV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
